{# Shown when somebody asks for a page that does not exist. An error page
   should say what happened and offer the way back, not apologise. #}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page not found</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
<style>
  /* The one page that wants its content in the middle of the screen. */
  .lost {
    min-height: 80vh;
    display: grid;
    place-content: center;
    text-align: left;
    max-width: 34ch;
    margin-inline: auto;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="lost">
    <h1 class="section__title">There is no page at that address</h1>
    <p class="section__intro">
      The link may be out of date, or the address may have a typo in it.
    </p>
    <p><a class="cta" href="{{ url_for('home') }}">Go to the course page</a></p>
  </div>
</div>
</body>
</html>
